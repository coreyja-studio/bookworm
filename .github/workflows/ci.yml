name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check entrypoint syntax and startup behavior
        run: |
          sh -n start.sh
          python3 -B -m unittest discover -s tests -p startup_test.py

  fmt:
    uses: ./.github/workflows/_fmt.yml

  rust-checks:
    uses: ./.github/workflows/_rust-checks.yml

  ts-checks:
    uses: ./.github/workflows/_ts-checks.yml

  docker:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ready:
    if: always()
    needs: [fmt, rust-checks, ts-checks, startup, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          for result in $results; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "Job result: $result (expected success or skipped)"
              exit 1
            fi
          done

  deploy:
    if: always() && needs.ready.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [ready]
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
